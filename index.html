<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monument Valley — 曲柄之章</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 三层：bg 背景天空/星点/极光 → gl WebGL 场景 → fx 点击波纹/灰尘 -->
    <canvas id="bg"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>

    <!-- 左上圆形菜单按钮（呼应视频） -->
    <div class="ui-circle" id="btnReset" role="button" tabindex="0" aria-label="重置关卡" title="重置关卡">
      <div class="ui-dot"></div>
    </div>

    <!-- 右上自动演示按钮：复现视频中的操作序列（转曲柄 → 艾达通关） -->
    <div class="ui-circle" id="btnAuto" role="button" tabindex="0" aria-label="自动演示" title="自动演示">
      <div class="ui-play"></div>
    </div>

    <div class="hint" id="hint">拖动右侧的转轮 · 点击你想让艾达前往的位置</div>
    <div class="chapter" id="chapter">第 一 章<small>迷 途 的 公 主</small></div>
  </div>

  <script>
  /* 模块脚本（importmap + ESM）加载失败兜底：3s 内未见启动标志则在提示位报错 */
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__MV_BOOTED) return;
      var h = document.getElementById('hint');
      if (h) { h.textContent = '资源加载失败，请检查网络后刷新重试'; h.style.opacity = 1; }
    }, 3000);
  });
  </script>
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
